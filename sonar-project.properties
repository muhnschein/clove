# SonarQube Cloud analysis settings. The scan runs from
# .github/workflows/build.yml; the project name and the quality gate are
# owned by the SonarQube Cloud UI and deliberately not restated here.
sonar.projectKey=muhnschein_clove
sonar.organization=muhnschein

# Everything, minus the exclusions below. A directory list would silently
# stop covering a crate the day somebody adds one; this cannot. Non-code
# files (docs/, man/, contrib/) carry no analyser, but they are still swept
# for leaked secrets, which is worth having here.
sonar.sources=.

# Integration tests, so they are measured as tests rather than as production
# code. Unit tests live in `#[cfg(test)]` modules inside the files they
# cover and cannot be split out this way. `sonar.tests` takes directories,
# not globs, so a new `crates/<x>/tests` has to be added to both lines —
# indexing a file as source *and* test is an analysis error, not a warning.
sonar.tests=crates/clove-core/tests

# `target/` is build output, `fuzz/corpus` and `fuzz/artifacts` are generated
# inputs (git-ignored, but a local scanner run would still walk them).
sonar.exclusions=crates/clove-core/tests/**,**/target/**,fuzz/corpus/**,fuzz/artifacts/**

sonar.sourceEncoding=UTF-8
