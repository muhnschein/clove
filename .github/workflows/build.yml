name: Build

on:
  # `main` only: a bare `push:` beside `pull_request:` runs everything twice.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Same rule as ci.yml: a pull request groups by branch, so a new push
# supersedes the run in flight. Everything else falls through to `run_id`,
# a group of one, never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The scan reads the tree and talks to SonarQube Cloud over SONAR_TOKEN.
# It writes nothing back here.
permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `secrets` is not exposed to a pull request opened from a fork, so this
    # job cannot authenticate there: it would fail every outside contribution
    # with a red X only a maintainer could clear. Skip it instead — the push
    # to `main` after the merge produces the analysis.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # A shallow clone costs the scanner its blame data, which is what
          # attributes an issue to a commit and drives the new-code period.
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The scanner does not fail on a file it cannot read: it logs a warning and
  # analyses nothing. On the first run three of the ten shell scripts hit that
  # — ci/fuzz.sh, ci/fuzz-coverage.sh and ci/fuzz-sanitizer-ab.sh — and one of
  # them failed at 1:1, so the whole file was skipped. All three parse clean
  # under `sh -n` and `bash -n`; the fault is in the analyser's parser, not the
  # scripts. Nothing in the dashboard says so. A file that is never read
  # reports zero issues, which is indistinguishable from a file that is clean,
  # and the gap widens silently as the scripts grow.
  #
  # So: same argument as ci/check-dicts.sh, one tool over. A checker that has
  # quietly stopped checking prints ok forever, and the only way to know is to
  # make it say so out loud.
  scan-coverage:
    name: Scan coverage
    needs: sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading the scan job's log is the whole point of this job.
      actions: read
    steps:
      - name: Fail on files the scanner could not parse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          job=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
                  --jq '.jobs[] | select(.name == "SonarQube") | .id')
          if [ -z "$job" ]; then
              echo "no SonarQube job in run $RUN_ID; nothing to check" >&2
              exit 1
          fi
          gh run view --repo "$REPO" --job "$job" --log > scan.log \
            || gh api "repos/$REPO/actions/jobs/$job/logs" > scan.log
          # The two shell analysers word it differently and disagree about
          # where the file broke, so match both. Anchored on their exact
          # phrasing to keep this from firing on ordinary log text.
          if grep -nE "Cannot parse '|Syntax error in " scan.log; then
              echo >&2
              echo "The scanner could not parse the file(s) listed above, so" >&2
              echo "it analysed nothing in them. That is a silent gap in" >&2
              echo "coverage, not a clean result. Either restate the code in" >&2
              echo "a form the analyser accepts, or exclude the file and say" >&2
              echo "why in sonar-project.properties." >&2
              exit 1
          fi
          echo "scan coverage: the scanner parsed every file it opened"
