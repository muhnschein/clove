name: ci

on:
  # `main` only: a bare `push:` beside `pull_request:` runs everything twice.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly deep fuzzing; everything else runs per push and pull request.
    - cron: '17 3 * * *'
  workflow_dispatch:

# A pull request groups by branch, so a new push supersedes the run in flight.
# Everything else falls through to `run_id`: a group of one, never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A deadlock must fail the job in minutes, not burn the platform's
    # six-hour ceiling. Tier-1 runs in well under a minute today.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The pinned toolchain comes from rust-toolchain.toml; rustup installs
      # it (with clippy + rustfmt) on the first cargo invocation. Do not
      # `rustup update stable` here — that would defeat the pin.
      - run: rustc --version
      - run: cargo fmt --all --check
      # `--locked` on every command that resolves dependencies: CI must build
      # the Cargo.lock that was reviewed, not one cargo quietly updated on the
      # runner. It has to be on all of them, not just the build — clippy runs
      # first, and a clippy that rewrote the lockfile would leave a later
      # `cargo build --locked` asserting against the file clippy just wrote.
      # The fuzz crate below is deliberately excluded: `fuzz/.gitignore` keeps
      # its `Cargo.lock` out of the tree, so `--locked` there fails outright.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The fuzz crate is outside the workspace, so nothing above compiles it
      # and a changed signature in clove-core rots a target silently until the
      # nightly job trips over it (this happened to `tracker`). Checking it
      # takes seconds and needs no nightly toolchain — only running the fuzzer
      # does.
      - run: cargo check --manifest-path fuzz/Cargo.toml
      - run: ./ci/check-net-deps.sh
      # Same argument one asset over. The dictionaries are read only by the
      # scheduled fuzz job, which passes `-dict=` for every target and dies
      # before fuzzing anything if one file is missing or has a line libFuzzer
      # cannot parse — so a typo in one costs a night and shows up as a red
      # target that has nothing wrong with it. The self-test runs first,
      # because a grammar check that has stopped matching prints ok forever.
      - run: ./ci/check-dicts.sh --self-test
      - run: ./ci/check-dicts.sh
      # The scan-coverage gate in build.yml restates SonarQube's log wording,
      # so its matcher rots exactly the way check-dicts' does — reword the
      # WARN upstream and the gate goes green forever. The self-test is
      # milliseconds and belongs here too, where a contributor who has never
      # looked at build.yml still sees it break.
      - run: ./ci/check-scan-coverage.sh --self-test
      # End-to-end: drive the real binaries as an operator does. Unit tests
      # cannot see whole-process faults (the Phase-F registry deadlocks
      # passed all of them).
      - run: cargo build --workspace --locked
      - run: ./ci/smoke.sh
      # Crash and I/O-failure resilience: the temp-then-rename state promise
      # is only worth what it is tested at (SCOPE §9). Runs unprivileged here,
      # so the unwritable-directory case is exercised for real.
      - run: ./ci/chaos.sh
      # The half of the daemon no router-free test could reach: session
      # creation, the forwarded inbound listener, naming lookup, an announce and
      # a peer, against a fake SAM bridge that answers. Every live run has
      # broken somewhere in there.
      #
      # `--trace` also fails the job if the post-init seccomp allowlist refuses a
      # syscall the daemon actually makes, which is what stops that list rotting
      # as the daemon grows. Tolerant install: without strace the script skips
      # the tracing half and still runs the rest, and a missing package is not a
      # reason to fail the build.
      - run: sudo apt-get update && sudo apt-get install -y strace || true
      - run: ./ci/router.sh --trace

  # Coverage-guided fuzzing needs nightly, so it runs on a schedule rather
  # than blocking every push; the deterministic sweep in
  # crates/clove-core/tests/hostile.rs covers parsers on each commit.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Headroom over the largest budget, not a number to itself. The two
    # largest are `tracker` and `extensions` at 900s, and the job pays for a
    # nightly install, a `cargo install cargo-fuzz` and a sanitizer build
    # before any of it, then `cmin` over the largest corpus in the set
    # afterwards. Kept at 75 through a budget that went to 1500s and back:
    # this is headroom, and trimming it buys nothing.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Budgets are per-target because the targets are not alike, and they
        # live in exactly one place: `budget_for` in ci/fuzz.sh, which the run
        # step below asks. This list used to carry its own copy with a comment
        # saying the two must agree — a rule somebody had to remember, on a
        # file nobody edits often, where forgetting means this job silently
        # running the wrong budgets for months.
        target:
          - wire
          - bencode
          - json
          - metainfo
          - extensions
          - http
          - tracker
          - resume
          - magnet
          - dest
          - text
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The committed seed corpus starts each run warm; this carries what the
      # run *discovers* to the next one. Without it every scheduled run spends
      # much of its budget rediscovering that input has to be bencode at all,
      # which is the difference between fuzzing the parser and fuzzing the
      # question of whether the input is a torrent.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - run: rustup toolchain install nightly
      - run: cargo install cargo-fuzz --locked
      # Committed seeds on top of whatever the cache restored: the cache can be
      # evicted or cold, and a run that starts from nothing is a slower run.
      - run: tar xzf fuzz/seed-corpus.tar.gz -C fuzz -k || true
      - run: |
          secs=$(./ci/fuzz.sh --budget ${{ matrix.target }})
          maxlen=$(./ci/fuzz.sh --max-len ${{ matrix.target }})
          echo "budget: ${{ matrix.target }} ${secs}s, max input ${maxlen} B"
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -dict=fuzz/dicts/${{ matrix.target }}.dict \
            -max_total_time="$secs" -max_len="$maxlen"
      # Minimise before the cache is written, not after it is read. libFuzzer
      # keeps an input for reaching a new execution-count bucket, not a new
      # edge, so a cache that is only ever added to grows without the coverage
      # growing with it — and a bloated corpus makes the *next* run slower and
      # shallower, because startup replays all of it and mutation energy is
      # split across all of it. Left alone this compounds every night.
      - if: success()
        run: cargo +nightly fuzz cmin ${{ matrix.target }}
      # `fuzz/corpus/` is git-ignored and the cache expires, so without this a
      # month of scheduled runs leaves nothing behind. The artifact is what
      # somebody folds into the committed seed with `make fuzz-seed`.
      - if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/

  man:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sudo apt-get update && sudo apt-get install -y mandoc
      # The manuals are the primary user documentation (SCOPE §9); keep them
      # parsing and conventional so they cannot rot unnoticed.
      - run: make man-lint
      # Same rule one level down: rustdoc links that point at renamed or
      # newly-private items are a build failure, not a warning nobody reads.
      - run: make doc-lint

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1

  # The published image and the release binaries are musl, and the daemon's
  # seccomp allowlist is libc-sensitive: `thread::sleep` is `clock_nanosleep`
  # under glibc and `nanosleep` under musl, so a list derived from one libc
  # can refuse a syscall the other's binary makes — which is a daemon that
  # dies on its first reconnect backoff, in the build nobody tests. So the
  # musl build gets the same end-to-end run the gnu one gets, tracing
  # included.
  musl:
    name: Static musl build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: cargo build --release --workspace --locked --target x86_64-unknown-linux-musl
      # `distroless/static` has no libc to load, so a binary that stopped
      # being static would be an image that cannot start.
      - name: The binaries are static
        run: |
          set -eu
          for bin in cloved clove; do
              path=target/x86_64-unknown-linux-musl/release/$bin
              file "$path" | grep -q 'static' || {
                  echo "$bin is not statically linked:" >&2
                  file "$path" >&2
                  exit 1
              }
          done
      - run: sudo apt-get update && sudo apt-get install -y strace || true
      - name: Drive the musl binaries end to end
        env:
          CLOVE_BIN_DIR: target/x86_64-unknown-linux-musl/release
        run: |
          set -eu
          ./ci/smoke.sh
          ./ci/router.sh --trace
      # The container seccomp profile is generated from what these binaries
      # actually call, so it is these binaries it has to keep fitting — and a
      # syscall the profile lacks is a daemon that dies at a moment no test
      # reaches. The other half of this question (whether a runtime agrees
      # with the profile) is the container job below, which starts the image
      # under it.
      - name: The seccomp profile still fits
        env:
          CLOVE_BIN_DIR: target/x86_64-unknown-linux-musl/release
        run: ./ci/seccomp-profile.sh --check

      # The other architecture the image is published for. Only a compile:
      # nothing here can run it, and what breaks across architectures is the
      # syscall table the sandbox names, which is a compile-time question.
      # `rust-lld` because the runner's `cc` cannot link an aarch64 object,
      # and the workspace has no C dependencies that would need more.
      - name: aarch64 compiles
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo check --release --workspace --locked --target aarch64-unknown-linux-musl

  # A Containerfile that stopped building is a release that fails at the tag,
  # which is the worst moment to find out. This also exercises the claims the
  # image makes about itself: that it runs unprivileged on a read-only root
  # filesystem, under contrib/container/seccomp/cloved.json rather than the
  # runtime's default profile, that a fresh named volume arrives writable by
  # the uid inside, and that the CLI in it can reach the daemon.
  #
  # The seccomp profile is the reason the `docker exec` below is an assertion
  # and not a convenience: the profile covers every process in the container,
  # so a filter too narrow for the CLI breaks `clove list` and the image's own
  # health check while leaving the daemon looking fine.
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: docker build -f contrib/container/Containerfile -t clove:ci .
      - name: It runs as the unprivileged uid
        run: |
          set -eu
          user=$(docker inspect --format '{{ .Config.User }}' clove:ci)
          [ "$user" = "65532:65532" ] || {
              echo "image runs as \"$user\", expected 65532:65532" >&2
              exit 1
          }
      # No router and no host network: the container has a namespace of its
      # own, nothing is listening on its loopback, and `waiting-for-router` is
      # therefore the correct and asserted answer.
      - name: It starts, and its CLI can reach it
        run: |
          set -eu
          docker volume create clove-ci-data >/dev/null
          docker run -d --name clove-ci \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --security-opt seccomp=contrib/container/seccomp/cloved.json \
            -v clove-ci-data:/var/lib/clove \
            clove:ci >/dev/null
          for _ in $(seq 20); do
              if docker exec clove-ci clove status >status.txt 2>&1; then
                  break
              fi
              sleep 1
          done
          cat status.txt
          grep -q 'waiting-for-router' status.txt || {
              echo "the daemon never came up in its container" >&2
              docker logs clove-ci >&2
              exit 1
          }
          docker exec clove-ci clove list >/dev/null
      # A seccomp denial is silent. The process dies with EPERM somewhere
      # inside the runtime's own init and the runtime reports whatever it
      # noticed next — the first failure here was a complaint about a network
      # namespace it could not bind-mount, which says nothing about the
      # syscall that caused it. So on any failure above, run the same profile
      # again in logging mode: the kernel then names every call the profile
      # does not allow, and the fix is a line in ci/seccomp-profile.sh.
      - name: Which syscalls the profile refused
        if: failure()
        run: |
          set -eu
          python3 - contrib/container/seccomp/cloved.json "$RUNNER_TEMP/log.json" <<'PROF'
          import json, sys
          profile = json.load(open(sys.argv[1]))
          profile["defaultAction"] = "SCMP_ACT_LOG"
          profile.pop("defaultErrnoRet", None)
          json.dump(profile, open(sys.argv[2], "w"))
          PROF
          docker rm -f clove-ci-log >/dev/null 2>&1 || true
          docker run -d --name clove-ci-log \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --security-opt seccomp="$RUNNER_TEMP/log.json" \
            clove:ci >/dev/null || true
          sleep 5
          docker exec clove-ci-log clove status >/dev/null 2>&1 || true
          docker exec clove-ci-log clove list >/dev/null 2>&1 || true
          sudo dmesg | grep -F 'type=1326' | tail -60 > "$RUNNER_TEMP/audit.txt" || true
          # The audit record carries syscall numbers; the names are in the
          # kernel headers the runner already has.
          python3 - "$RUNNER_TEMP/audit.txt" <<'AUDIT'
          import glob, re, sys
          names = {}
          for header in glob.glob("/usr/include/**/unistd_64.h", recursive=True):
              for line in open(header):
                  m = re.match(r"#define __NR_([a-z0-9_]+)\s+(\d+)", line)
                  if m:
                      names[int(m.group(2))] = m.group(1)
          seen = sorted({int(n) for n in re.findall(r"syscall=(\d+)", open(sys.argv[1]).read())})
          if not seen:
              print("no seccomp audit records; the failure was something else")
          for number in seen:
              print(f"  {names.get(number, '?'):24} (syscall {number})")
          AUDIT
          docker rm -f clove-ci-log >/dev/null 2>&1 || true

      # Not an assertion: which of Layer 2's two mechanisms a container
      # runtime lets through is a property of the host's seccomp profile and
      # kernel, and the daemon degrades to a log line either way. Printing it
      # is how the answer for GitHub's runners stays visible as both move.
      - name: What the sandbox came to here
        run: docker logs clove-ci 2>&1 | grep -i 'sandbox' || true
      # The Quadlet units are the recommended way to run this image, and
      # nothing above touches them — the runner has Docker, not a podman pod.
      # Quadlet's own generator settles the half that can be settled without
      # one: that the units parse, that every key is a key podman knows, and
      # that they generate the three services they claim to. Tolerant, like
      # man-lint without mandoc: a runner image that drops podman must not
      # fail the build.
      - name: The Quadlet units generate
        run: |
          set -eu
          gen=""
          for path in /usr/libexec/podman/quadlet /usr/lib/podman/quadlet; do
              [ -x "$path" ] && gen="$path" && break
          done
          if [ -z "$gen" ]; then
              echo "quadlet: SKIP (no quadlet generator on this runner)"
              exit 0
          fi
          out=$(mktemp -d)
          QUADLET_UNIT_DIRS="$PWD/contrib/container/quadlet" \
              "$gen" -dryrun -user > "$out/units.txt" 2> "$out/err.txt" || {
              echo "quadlet: the generator refused the units" >&2
              cat "$out/err.txt" >&2
              exit 1
          }
          cat "$out/err.txt"
          # The generator reports a bad key as a warning and carries on, so a
          # clean exit is not the assertion — the units it produced are.
          if grep -qiE 'error|unsupported key' "$out/err.txt"; then
              echo "quadlet: the generator complained about the units" >&2
              exit 1
          fi
          for unit in clove-pod.service i2pd.service cloved.service; do
              grep -q "$unit" "$out/units.txt" || {
                  echo "quadlet: no $unit was generated" >&2
                  cat "$out/units.txt" >&2
                  exit 1
              }
          done
          echo "quadlet: clove-pod, i2pd and cloved all generate"
      - if: always()
        run: docker rm -f clove-ci >/dev/null 2>&1 || true
