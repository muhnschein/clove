name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain comes from rust-toolchain.toml; rustup installs
      # it (with clippy + rustfmt) on the first cargo invocation. Do not
      # `rustup update stable` here — that would defeat the pin.
      - run: rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./ci/check-net-deps.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
