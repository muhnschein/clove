[workspace]
resolver = "2"
members = [
    "crates/i2pnet",
    "crates/clove-core",
    "crates/cloved",
    "crates/clove",
]
# cargo-fuzz targets need a nightly toolchain and pull in libfuzzer; they are
# a separate crate with its own lockfile so neither the dependency budget nor
# the stable build is affected. See fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
# Calendar versioning (calver.org): the release is named for the month it was
# cut in, `YYYY.0M`. Cargo insists on semver, which forbids the leading zero,
# so the manifest spells the same release `2026.8.0` and `clove_core::VERSION`
# carries the padded name everything user-facing prints. A test there keeps
# the two from drifting; bump both, or neither.
version = "2026.8.0"
edition = "2024"
rust-version = "1.94"
license = "ISC"
# Not published to crates.io: these are workspace-internal crates wired by
# path. (This also lets cargo-deny treat the internal path deps as private,
# not wildcard — see deny.toml `allow-wildcard-paths`.) Revisit if/when
# i2pnet or clove-core is published, at which point the path deps gain
# explicit versions.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
# clippy's default-on groups (correctness/suspicious/style/complexity/perf).
# Pinned to deny at the manifest level so a bare `cargo clippy` fails the same
# way CI's `-D warnings` does, rather than only warning locally.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
