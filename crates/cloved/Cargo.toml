[package]
name = "cloved"
description = "clove daemon: engine host, local HTTP API over unix socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clove-core = { path = "../clove-core" }
i2pnet = { path = "../i2pnet" }
getrandom = "0.2"
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }

# Layer-2 self-restriction (SCOPE §5). Linux-only, applied after
# initialisation; see crates/cloved/src/sandbox.rs. `libc` is here for the
# syscall numbers and address-family constants the seccomp filter names — it
# is already in the tree under both of the others, so this adds no crate.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"  # 0.4.7: ABI::V9 / ResolveUnix and CompatLevel (DEPENDENCIES.md)
seccompiler = "0.5"
libc = "0.2"

[dev-dependencies]
# Tests build real .torrent fixtures, which need SHA-1 piece hashes. Already
# in the tree via clove-core; dev-only, not part of the runtime budget.
sha1 = "0.11"

[lints]
workspace = true
