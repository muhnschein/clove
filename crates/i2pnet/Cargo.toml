[package]
name = "i2pnet"
description = "I2P network access layer for clove: the only socket-capable crate in the workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The in-memory network in `mock`. Off by default so it stays out of the
# binaries; the crates that test against it turn it on as a dev-dependency.
[features]
mock = []

[dependencies]
sha2 = { version = "0.11", default-features = false }
