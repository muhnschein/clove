[package]
name = "clove"
description = "clove control CLI: talks to cloved over the local HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A binary and nothing else. It was briefly a library too, so the
# escape-sequence decoder behind `clove top` could carry a fuzz target; with
# the full-screen view gone there is no parser here to fuzz and no reason for
# anything to link against the CLI.
[[bin]]
name = "clove"
path = "src/main.rs"

[dependencies]
clove-core = { path = "../clove-core" }
i2pnet = { path = "../i2pnet" }

[lints]
workspace = true
